<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">LuxNote AI</title>
  <desc id="desc">Luxury Design Project Assistant</desc>

  <defs>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DFC8"/>
      <stop offset="55%" stop-color="#D8BEAA"/>
      <stop offset="100%" stop-color="#B98872"/>
    </linearGradient>
  </defs>

  <!-- Architectural monogram -->
  <g transform="translate(42 34)">
    <path d="M18 126 L118 34 L220 126" fill="none" stroke="url(#champagne)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 116 V278 H190" fill="none" stroke="url(#champagne)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 122 V248 H158" fill="none" stroke="#F8F1E9" stroke-width="3" opacity=".92"/>
    <path d="M78 236 V128 L164 238 V130" fill="none" stroke="#F8F1E9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- subtle drafting line -->
    <path d="M58 145 V256" fill="none" stroke="#A77C78" stroke-width="2" stroke-dasharray="10 10" opacity=".75"/>

    <!-- circuit motif -->
    <path d="M154 78 V116 L184 144 V182 L210 208 V258" fill="none" stroke="#D8BEAA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="154" cy="78" r="7" fill="#391214" stroke="#D8BEAA" stroke-width="4"/>
    <circle cx="184" cy="144" r="7" fill="#391214" stroke="#D8BEAA" stroke-width="4"/>
    <circle cx="210" cy="208" r="7" fill="#391214" stroke="#D8BEAA" stroke-width="4"/>
    <circle cx="210" cy="258" r="7" fill="#391214" stroke="#D8BEAA" stroke-width="4"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(330 0)">
    <text x="0" y="205"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="148"
      letter-spacing="-5"
      fill="#FFFDF9">LuxNote</text>

    <text x="720" y="205"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="148"
      letter-spacing="-3"
      fill="url(#champagne)">AI</text>

    <line x1="8" y1="255" x2="116" y2="255" stroke="#D8BEAA" stroke-width="3" opacity=".9"/>
    <line x1="1098" y1="255" x2="1206" y2="255" stroke="#D8BEAA" stroke-width="3" opacity=".9"/>

    <text x="142" y="266"
      font-family="Arial, Helvetica, sans-serif"
      font-size="25"
      font-weight="500"
      letter-spacing="10"
      fill="#D8BEAA">LUXURY DESIGN PROJECT ASSISTANT</text>
  </g>
</svg>
